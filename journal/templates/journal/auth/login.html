<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    {%load static %}
    <link rel="stylesheet" href="{%static 'journal/css/login.css'%}">

</head>
<body>

    <div class="left-panel">
        <div class="art-object"></div>
    </div>

    <div class="right-panel">
        <div class="form-container">
            <div class="header">
                <h1>Welcome back</h1>
                <p>Enter your details to access your account.</p>
            </div>

            <form method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                {% if form.errors %}
                <p style="color: #ef4444; margin-bottom: 1rem; text-align: center; font-weight: 500;">Invalid username or password.</p>
                {% endif %}


                <div class="input-group">
                    <div class="input-wrapper">
                        <div class="input-cover">Username</div>
                        <input type="text" name="username" class="real-input" placeholder="johndoe" required>
                    </div>
                </div>

                <div class="input-group">
                    <div class="input-wrapper">
                        <div class="input-cover">Password</div>
                        
                        <input
                            type="password"
                            id="passwordInput"
                            name="password"
                            class="real-input"
                            placeholder="••••••••"
                            style="padding-right: 3rem;"
                            required
                        >
                        
                        <button type="button" class="password-toggle" onclick="togglePassword()">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20"
                                viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>


                <button type="submit" class="btn-signup">Log in</button>
            </form>


            <div class="footer-text" style="margin-top: 1.5rem; text-align: center; color: #888;">
                Don't have an account? <a href="{% url 'signup' %}" style="color: rgb(5, 29, 243); text-decoration: none; font-weight: 500;">Sign up</a>
            </div>
        </div>
    </div>
<script>
function togglePassword() {
    const pwdInput = document.getElementById('passwordInput');
    const eyeIcon = document.getElementById('eyeIcon');
    if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><line x1="3" y1="3" x2="21" y2="21"></line>';
    } else {
        pwdInput.type = 'password';
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
    }
}
</script>
</body>
</html>
