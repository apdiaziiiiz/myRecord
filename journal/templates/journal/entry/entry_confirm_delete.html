{% extends 'journal/base.html' %}

{% block title %}Delete Entry | MyRecord{% endblock %}

{% block content %}
<div class="header-row">
    <h1 class="page-title">Delete Entry</h1>
</div>

<div class="form-card">
    <div class="card" style="text-align: center; padding: 3rem;">
        <i class="fas fa-exclamation-triangle" style="font-size: 4rem; color: #a30000; margin-bottom: 1.5rem;"></i>
        <h2 style="margin-bottom: 1rem;">Are you sure?</h2>
        <p style="color: var(--text-dim); margin-bottom: 2rem;">
            You are about to delete your entry for <strong>{{ object.date|date:"F d, Y" }}</strong>. This action cannot be undone.
        </p>
        
        <form method="post">
            {% csrf_token %}
            <div style="display: flex; gap: 1rem; justify-content: center;">
                <button type="submit" class="btn" style="background: #a30000; color: #fff;">
                    <i class="fas fa-trash"></i> Yes, Delete
                </button>
                <a href="{% url 'entry_detail' object.pk %}" class="btn" style="background: #222; color: #fff;">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
